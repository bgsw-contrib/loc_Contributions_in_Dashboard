name: Daily LOC Contributions Tracker

on:
  schedule:
    # Runs everyday at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger of the workflow from the Actions tab

# Set permissions at the workflow level to allow both writing commits and deploying to Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: Ubuntu-Latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Tracker Script and Show Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python get_contributions.py
          # Output the dashboard to the GitHub Actions Job Summary so it displays in the run overview
          cat README.md >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          if git diff --quiet README.md index.html; then
            echo "No changes to the dashboard or index.html."
          else
            git add README.md index.html
            git commit -m "chore: auto-update contributions dashboard and HTML page [skip ci]"
            git push
          fi

  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: Ubuntu-Latest
    needs: update-dashboard # Deploy only after update-dashboard succeeds and commits the latest index.html

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # Pull the absolute latest code that was just pushed by the previous job

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Upload root folder containing index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

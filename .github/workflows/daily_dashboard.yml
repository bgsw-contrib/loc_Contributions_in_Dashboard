name: Daily LOC Contributions Tracker

on:
  schedule:
    # Runs everyday at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger of the workflow from the Actions tab

# Set permissions at the workflow level to allow both writing commits and deploying to Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  line-of-code:
    name: 📊 Line of Code Stage
    runs-on: [self-hosted, Linux, X64, HYD_SLEF]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run LOC Tracker Script and Show Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_TOKEN_TRACKER19: ${{ secrets.JIRA_TOKEN_TRACKER19 }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          python get_contributions.py
          # Output the dashboard to the GitHub Actions Job Summary so it displays in the run overview
          cat README.md >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push changes
        run: |
          # Configure Git to dynamically use the name and email of the last commit author
          git config --global user.name "$(git log -1 --format='%an')"
          git config --global user.email "$(git log -1 --format='%ae')"
          
          # Check if there are changes to commit
          if git diff --quiet README.md index.html; then
            echo "No changes to the dashboard or index.html."
          else
            git add README.md index.html
            git commit -m "chore: auto-update contributions dashboard and HTML page [skip ci]"
            git push
          fi

  task-status:
    name: ⏳ Task Status Stage
    runs-on: [self-hosted, Linux, X64, HYD_SLEF]
    needs: line-of-code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate Jira JQL Search Quotas & Connections
        env:
          JIRA_TOKEN_TRACKER19: ${{ secrets.JIRA_TOKEN_TRACKER19 }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          # Test querying Track&Release with simplified check to log validation metrics in GHA summary
          python3 -c "
          import requests, urllib.parse, os
          token = os.getenv('JIRA_TOKEN_TRACKER19') or os.getenv('JIRA_TOKEN')
          if not token:
              print('Warning: JIRA_TOKEN is missing. Validating offline state.')
              exit(0)
          encoded_jql = urllib.parse.quote('project = NEETASOSS AND resolution is EMPTY')
          url = f'https://rb-tracker.bosch.com/tracker19/rest/api/2/search?jql={encoded_jql}&maxResults=1'
          res = requests.post(url, json={'jql': 'project = NEETASOSS AND resolution is EMPTY', 'maxResults': 1}, headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'})
          print(f'Jira validation completed. Response code: {res.status_code}')
          "

  system-health:
    name: ⚙️ System Health & Deployment Stage
    runs-on: [self-hosted, Linux, X64, HYD_SLEF]
    needs: task-status

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # Pull the absolute latest code that was just pushed by the line-of-code job

      - name: Run Linter Validation
        run: |
          # Validate get_contributions.py python syntax compilation
          python3 -m py_compile get_contributions.py
          echo "Python syntax validation passed successfully."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Upload root folder containing index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Daily LOC Contributions Tracker

on:
  schedule:
    # Runs everyday at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger of the workflow from the Actions tab

jobs:
  update-dashboard:
    runs-on: Ubuntu-Latest
    permissions:
      contents: write # Allows pushing the updated README/dashboard back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Tracker Script and Show Summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python get_contributions.py
          # Output the report to the GitHub Actions Job Summary so it displays in the run overview
          cat report.md >> $GITHUB_STEP_SUMMARY

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          if git diff --quiet README.md report.md; then
            echo "No changes to the dashboard or report."
          else
            git add README.md report.md
            git commit -m "chore: auto-update contributions dashboard and report [skip ci]"
            git push
          fi
